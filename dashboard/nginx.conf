server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Approved versions come from a read-only volume. Only the pointer and each version's
    # estimates and metadata are exposed; nothing else in the directory is listed or served.
    location ~ ^/approved/(current|[\w-]+/(estimates\.csv|meta\.json))$ {
        alias /srv/approved/$1;
        add_header Cache-Control "no-store";
        default_type text/plain;
        types {
            application/json json;
            text/csv csv;
        }
    }

    location /approved/ {
        return 404;
    }
}
